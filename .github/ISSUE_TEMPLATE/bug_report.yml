name: Bug report
description: Report a reproducible PaperSteps problem using synthetic or redacted data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload documents containing personal information.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a generated, public-domain, or fully redacted document.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal and confidential information from this report.
          required: true
